# NextAction Policy Training Configuration for Touch Dataset
# This config trains the NextAction policy on the created touch dataset

seed: 42
batch_size: 16  # Smaller batch size for the limited dataset
num_workers: 4
steps: 2000     # Reduced for the smaller dataset (3 episodes)
log_freq: 50
save_freq: 500
eval_freq: 1000
save_checkpoint: true

# Output directory for saving models and logs
output_dir: "outputs/nextaction_touch_training"

# Dataset configuration
dataset:
  repo_id: "adungus/touch"  # The touch dataset we created
  root: "/Users/aditya/.cache/huggingface/lerobot/adungus/touch"
  episodes: null  # Use all 3 episodes
  image_transforms:
    enable: true
    crop:
      enable: false
    grayscale:
      enable: false
    resize:
      enable: true
      height: 128
      width: 128
  
# Policy configuration
policy:
  type: "nextaction"
  device: "mps"  # Using MPS for Mac
  
  # Observation steps (how many past frames/actions to use)
  n_obs_steps: 5
  
  # Architecture parameters
  vision_backbone_dim: 256
  touch_backbone_dim: 128
  hidden_dim: 512
  gru_num_layers: 2
  
  # CNN architecture
  vision_cnn_channels: 32
  touch_cnn_channels: 16
  
  # Input dimensions - matching the dataset
  img_size: 128
  touch_height: 20
  touch_width: 20
  
  # Output and training
  tanh_output: false
  dropout: 0.1
  use_amp: false  # Disable AMP for MPS
  
  # Optimization
  optimizer_lr: 1e-3
  optimizer_weight_decay: 1e-5

# Optimizer configuration  
optimizer:
  type: "adamw"
  grad_clip_norm: 1.0

# Logging configuration
wandb:
  enable: false  # Set to true to use Weights & Biases
  project: "nextaction_touch_training"
  notes: "Training NextAction policy with synthetic touch data"
  tags: ["nextaction", "touch", "vision"]

# Environment configuration (optional, for evaluation)
env: null

# Evaluation configuration
eval:
  n_episodes: 3
  batch_size: 2
